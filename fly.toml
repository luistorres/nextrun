app = "nextrun"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile.fly"

  [build.args]
    NEXT_PUBLIC_APP_URL = "https://nextrun.fly.dev"

[deploy]
  release_command = "node_modules/.bin/tsx src/lib/db/migrate.ts"

[env]
  FIT_STORAGE_DIR = "/data/fit"
  AUTH_TRUST_HOST = "true"

[mounts]
  source = "fit_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Worker runs in this machine — it must never scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
